<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#F3F1EB">
  <meta name="description" content="pyaxy — 随手记录，慢慢折腾。">
  <title>pyaxy · dry.li</title>
  <link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAACXBIWXMAADsOAAA7DgHMtqGDAAAAgElEQVRYhWNgGAV0AEYFsmGGRXL/YdigSG4lA72AcZGkiGGh7Eu45YVyr/WKlcTo5gDDIrlVaL4PpZvlRqNBX0RB0ItLiP2nJiY5/sRHHSAxyKKAgc76GUYdID4aBRKjiVBscGVD8YEuiMRHHSBBxygwGm1KFY22YuVGWAdiRAMAeoR7fIqrne0AAAAASUVORK5CYII=">
  <style>
    :root {
      color-scheme: light;
      --background: #F3F1EB;
      --text: #2d302b;
      --muted: #686b64;
      --focus: #2d302b;
    }

    * { box-sizing: border-box; }

    html {
      min-height: 100%;
      background: var(--background);
    }

    body {
      margin: 0;
      color: var(--text);
      /* 系统字体用于正文与导航，保持清晰，也不需要下载字体。 */
      font-family: -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    main {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 56px 28px;
    }

    .home {
      width: fit-content;
      max-width: 100%;
    }

    h1 {
      margin: 0;
      font-size: 32px;
      line-height: 1.25;
      letter-spacing: -0.6px;
      font-weight: 600;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
    }

    .sites {
      display: flex;
      gap: 20px;
      margin-top: 28px;
    }

    a {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      color: inherit;
      font-size: 15px;
      text-decoration: none;
      text-underline-offset: 5px;
      text-decoration-thickness: 1px;
    }

    a:hover { text-decoration: underline; }

    .icon-link {
      width: 20px;
      flex: none;
      justify-content: center;
    }

    .icon-link svg {
      display: block;
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .icon-link:hover { color: var(--muted); }

    a:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 4px;
    }

    @media (max-width: 480px) {
      .sites { gap: 14px; }
      a { font-size: 14px; }
    }
  </style>
</head>
<body>
  <main>
    <section class="home" aria-labelledby="name">
      <!-- 在这里修改名字和介绍。 -->
      <h1 id="name">pyaxy</h1>
      <p class="subtitle">随手记录，慢慢折腾</p>

      <nav class="sites" aria-label="网站入口">
        <a href="https://blog.pyaxy.com/" aria-label="Blog · 博客">
          <span>Blog</span>
        </a>
        <a href="https://status.dry.li/" aria-label="Status · 服务状态">
          <span>Status</span>
        </a>
        <a href="https://mon.dry.li/" aria-label="Probe · 探针">
          <span>Probe</span>
        </a>
        <a class="icon-link" href="mailto:contact@pyaxy.com" aria-label="Email · contact@pyaxy.com" title="contact@pyaxy.com">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        </a>
        <a class="icon-link" href="https://github.com/Pyaxy" aria-label="GitHub · Pyaxy" title="GitHub · Pyaxy">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
        </a>
      </nav>
    </section>
  </main>
</body>
</html>
